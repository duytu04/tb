<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="goldMonogram" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3DE9A"/>
      <stop offset="30%" stop-color="#C59B27"/>
      <stop offset="70%" stop-color="#E5C77A"/>
      <stop offset="100%" stop-color="#9A7416"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#C59B27" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Circular subtle wreath or flourish ring -->
  <circle cx="100" cy="100" r="92" stroke="url(#goldMonogram)" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.6"/>
  <circle cx="100" cy="100" r="86" stroke="url(#goldMonogram)" stroke-width="0.8" opacity="0.4"/>

  <!-- Botanical flourishes on the ring -->
  <path d="M100 12 C90 12 85 5 100 2 C115 5 110 12 100 12 Z" fill="url(#goldMonogram)"/>
  <path d="M100 188 C90 188 85 195 100 198 C115 195 110 188 100 188 Z" fill="url(#goldMonogram)"/>

  <!-- Intertwined letters 'A' and 'T' -->
  <g filter="url(#goldGlow)">
    <!-- Letter A -->
    <path d="M48 142 L58 142 L88 56 L96 56 L124 142 L136 142 M70 114 L114 114" 
          stroke="url(#goldMonogram)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Serif footers for A -->
    <path d="M44 142 L62 142 M120 142 L140 142" stroke="url(#goldMonogram)" stroke-width="3" stroke-linecap="round"/>

    <!-- Letter T intertwined -->
    <path d="M82 66 L154 66 M118 66 L118 142" 
          stroke="url(#goldMonogram)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Flourishes on T top bar and bottom hook -->
    <path d="M78 61 C82 66 84 71 82 75 M158 61 C154 66 152 71 154 75" 
          stroke="url(#goldMonogram)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M110 142 C120 142 128 145 132 138" 
          stroke="url(#goldMonogram)" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Small heart or ampersand connecting them -->
    <path d="M100 96 C98 90 92 88 88 92 C82 98 100 110 100 110 C100 110 118 98 112 92 C108 88 102 90 100 96 Z" 
          fill="url(#goldMonogram)"/>
  </g>
</svg>
