<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C378" />
      <stop offset="50%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#9A7416" />
    </linearGradient>
    <linearGradient id="goldPetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9EC" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F2DFAC" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Stems & Foliage -->
  <g stroke="url(#goldGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Long arching stem 1 -->
    <path d="M190 680 C185 520 220 380 260 250" stroke-width="2.5" fill="none"/>
    <!-- Stem 2 -->
    <path d="M190 680 C195 560 260 480 340 370" stroke-width="2.2" fill="none"/>
    <!-- Stem 3 (left) -->
    <path d="M190 680 C175 580 130 500 90 420" stroke-width="2" fill="none"/>

    <!-- Leaves -->
    <path d="M188 620 C150 510 110 420 70 330 C100 370 140 460 185 580" fill="url(#goldPetal)" stroke-width="1.6"/>
    <path d="M195 590 C240 490 300 410 380 340 C340 390 280 490 200 570" fill="url(#goldPetal)" stroke-width="1.6"/>
    <path d="M190 530 C170 410 185 300 150 200 C175 250 185 350 192 480" fill="url(#goldPetal)" stroke-width="1.5"/>
    <path d="M210 470 C270 390 310 290 350 210 C330 260 280 360 215 450" fill="url(#goldPetal)" stroke-width="1.5"/>

    <!-- Lower Flower (Narcissus Side View) -->
    <g transform="translate(140, 400) scale(0.85)">
      <!-- Petals -->
      <path d="M-60 -30 C-90 -10 -95 30 -60 50 C-40 30 -20 10 0 0 Z" fill="url(#goldPetal)" stroke-width="1.8"/>
      <path d="M-50 40 C-40 80 -10 95 20 85 C15 55 5 25 0 0 Z" fill="url(#goldPetal)" stroke-width="1.8"/>
      <path d="M20 75 C60 85 90 65 95 30 C65 20 35 10 0 0 Z" fill="url(#goldPetal)" stroke-width="1.8"/>
      <path d="M80 20 C110 -10 100 -50 70 -65 C50 -35 25 -15 0 0 Z" fill="url(#goldPetal)" stroke-width="1.8"/>
      <path d="M50 -60 C20 -95 -20 -90 -45 -60 C-25 -40 -10 -20 0 0 Z" fill="url(#goldPetal)" stroke-width="1.8"/>
      <path d="M-40 -55 C-80 -70 -100 -40 -85 -10 C-60 -5 -30 0 0 0 Z" fill="url(#goldPetal)" stroke-width="1.8"/>
      <!-- Trumpet cup / corona -->
      <path d="M-20 -25 C-5 -40 25 -40 40 -20 C45 0 35 25 20 35 C-5 40 -25 25 -30 5 C-32 -10 -28 -20 -20 -25" fill="#FAF1D6" stroke-width="2"/>
      <path d="M-15 -18 Q5 -30 28 -15 Q36 2 15 25 Q-15 28 -20 0" stroke-width="1.2" stroke-dasharray="2,3"/>
      <!-- Inner details -->
      <circle cx="5" cy="2" r="3" fill="url(#goldGrad)"/>
      <path d="M5 2 L12 8 M5 2 L0 10 M5 2 L14 -4" stroke-width="1.5"/>
    </g>

    <!-- Main Upper Bloom (Full facing Narcissus) -->
    <g transform="translate(265, 230)">
      <!-- 6 radiating petals -->
      <!-- Petal 1 Top -->
      <path d="M0 0 C-25 -45 -35 -105 0 -140 C35 -105 25 -45 0 0 Z" fill="url(#goldPetal)" stroke-width="2"/>
      <path d="M0 -30 Q0 -90 0 -130" stroke-width="1" stroke-dasharray="1,4"/>

      <!-- Petal 2 Top Right -->
      <path d="M0 0 C25 -40 85 -75 125 -60 C110 -20 60 15 0 0 Z" fill="url(#goldPetal)" stroke-width="2"/>
      <path d="M20 -15 Q65 -35 110 -50" stroke-width="1" stroke-dasharray="1,4"/>

      <!-- Petal 3 Bottom Right -->
      <path d="M0 0 C45 10 95 50 110 95 C65 110 25 65 0 0 Z" fill="url(#goldPetal)" stroke-width="2"/>
      <path d="M25 15 Q65 45 95 80" stroke-width="1" stroke-dasharray="1,4"/>

      <!-- Petal 4 Bottom -->
      <path d="M0 0 C20 45 25 110 -5 135 C-35 110 -20 45 0 0 Z" fill="url(#goldPetal)" stroke-width="2"/>
      <path d="M-2 25 Q-5 75 -5 120" stroke-width="1" stroke-dasharray="1,4"/>

      <!-- Petal 5 Bottom Left -->
      <path d="M0 0 C-40 25 -85 65 -125 45 C-115 5 -60 -15 0 0 Z" fill="url(#goldPetal)" stroke-width="2"/>
      <path d="M-25 10 Q-65 25 -105 35" stroke-width="1" stroke-dasharray="1,4"/>

      <!-- Petal 6 Top Left -->
      <path d="M0 0 C-35 -20 -85 -45 -95 -95 C-55 -105 -20 -60 0 0 Z" fill="url(#goldPetal)" stroke-width="2"/>
      <path d="M-20 -15 Q-55 -45 -80 -80" stroke-width="1" stroke-dasharray="1,4"/>

      <!-- Ruffled Cup / Center Corona -->
      <circle cx="0" cy="0" r="38" fill="#FDF5DC" stroke-width="2"/>
      <path d="M-36 -12 C-38 -25 -25 -38 -12 -36 C0 -42 15 -38 28 -28 C40 -18 42 -5 36 12 C38 25 25 38 12 36 C0 42 -15 38 -28 28 C-40 18 -42 5 -36 -12 Z" fill="#FBF0CC" stroke-width="1.8"/>
      <!-- Inner cup ruffle edge -->
      <circle cx="0" cy="0" r="26" fill="none" stroke-width="1.3" stroke-dasharray="3,2"/>
      <circle cx="0" cy="0" r="14" fill="#F4E2AA" stroke-width="1.5"/>

      <!-- Pistil / Stamens with golden pollen tips -->
      <circle cx="-6" cy="-5" r="3" fill="url(#goldGrad)"/>
      <circle cx="7" cy="-6" r="3" fill="url(#goldGrad)"/>
      <circle cx="9" cy="5" r="3" fill="url(#goldGrad)"/>
      <circle cx="-3" cy="8" r="3" fill="url(#goldGrad)"/>
      <circle cx="-8" cy="1" r="2.5" fill="url(#goldGrad)"/>
      <circle cx="0" cy="0" r="3.5" fill="#B38515"/>
    </g>

    <!-- Top Bud / Small Blossom -->
    <g transform="translate(345, 360) scale(0.6)">
      <path d="M0 0 C-15 -30 -20 -70 5 -90 C25 -65 15 -30 0 0 Z" fill="url(#goldPetal)" stroke-width="2"/>
      <path d="M0 0 C20 -25 55 -40 75 -25 C60 0 35 15 0 0 Z" fill="url(#goldPetal)" stroke-width="2"/>
      <path d="M0 0 C-25 10 -55 25 -65 0 C-50 -20 -25 -10 0 0 Z" fill="url(#goldPetal)" stroke-width="2"/>
      <ellipse cx="5" cy="-20" rx="18" ry="14" fill="#FDF3D5" stroke-width="1.8"/>
    </g>
  </g>
</svg>
