<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Wax base gradient (Deep burgundy & crimson with gold accents or pure metallic gold) -->
    <radialGradient id="waxBase" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#E85D4E"/>
      <stop offset="30%" stop-color="#C22A22"/>
      <stop offset="70%" stop-color="#8F1410"/>
      <stop offset="100%" stop-color="#5E0B08"/>
    </radialGradient>

    <!-- Gold rim gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEAB3"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#AA820A"/>
      <stop offset="100%" stop-color="#5E4400"/>
    </linearGradient>

    <!-- 3D Shadow for stamp -->
    <filter id="waxShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#3A0806" flood-opacity="0.5"/>
    </filter>

    <!-- Inner Stamp Inset Shadow -->
    <filter id="innerEmboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#FFE8A3" flood-opacity="0.6"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation="1.5" flood-color="#4A0505" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Outer irregular wax dripping perimeter -->
  <path d="M80 8 C102 6 120 18 135 32 C150 48 156 68 152 90 C148 114 136 134 116 146 C96 158 68 156 46 146 C24 136 10 118 7 94 C4 72 14 50 30 32 C46 14 62 10 80 8 Z" 
        fill="url(#waxBase)" filter="url(#waxShadow)"/>

  <!-- Secondary dripping layer -->
  <path d="M78 14 C100 12 118 24 130 38 C144 54 148 74 144 94 C140 114 128 130 110 140 C92 150 68 148 50 138 C32 128 20 112 18 92 C16 72 26 52 40 38 C54 22 66 16 78 14 Z" 
        fill="url(#waxBase)" opacity="0.9"/>

  <!-- Inner circular ring with embossed gold bead border -->
  <circle cx="80" cy="80" r="54" fill="#9C1713" stroke="url(#goldRim)" stroke-width="2.5"/>
  <circle cx="80" cy="80" r="48" fill="none" stroke="url(#goldRim)" stroke-width="1" stroke-dasharray="3,3" opacity="0.85"/>

  <!-- Intertwined Monogram AT in gold inside wax seal -->
  <g filter="url(#innerEmboss)">
    <!-- Letter A -->
    <path d="M52 104 L72 52 L82 52 L98 104 M62 88 L90 88" 
          stroke="url(#goldRim)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Letter T -->
    <path d="M72 58 L114 58 M93 58 L93 104" 
          stroke="url(#goldRim)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Connecting heart flourish -->
    <path d="M80 80 C79 77 75 75 73 78 C70 82 80 88 80 88 C80 88 90 82 87 78 C85 75 81 77 80 80 Z" 
          fill="url(#goldRim)"/>
  </g>

  <!-- Specular highlights on wax edge -->
  <path d="M38 34 C50 22 66 16 82 16" stroke="#FFA39E" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M42 42 C54 30 70 24 84 24" stroke="#FFF" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.4"/>
</svg>
