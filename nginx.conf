server {
    listen 80;
    server_name localhost;
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location = / {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /index.html =404;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /admin.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ =404;
    }

    # Đảm bảo file cấu hình config.js không bao giờ bị dính cache cũ trên trình duyệt khách mời
    location = /js/config.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # Tài nguyên tĩnh có URL phiên bản/tên duy nhất được lưu lâu dài trên trình duyệt.
    # Khi thay CSS/JS cần tăng tham số ?v=... trong HTML.
    location ~* \.(?:css|js|svg|png|jpe?g|webp|gif|ico|woff2?|mp3|mp4)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Chuyển tiếp toàn bộ API lưu cấu hình và ảnh lên dịch vụ máy chủ nội bộ
    location /api/ {
        proxy_pass http://172.17.0.1:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 90s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        client_max_body_size 100M;
    }
}
